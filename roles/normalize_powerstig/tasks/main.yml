---
- name: Verify PowerSTIG module is available
  ansible.windows.win_powershell:
    script: |
      if (-not (Get-Module -ListAvailable -Name PowerSTIG)) {
        throw "PowerSTIG module is not installed. Install with: Install-Module -Name PowerSTIG -Force"
      }
      (Get-Module -ListAvailable -Name PowerSTIG).Version.ToString()
  register: normalize_powerstig_version_check
  tags:
    - powerstig

- name: Validate STIG version format
  ansible.builtin.assert:
    that:
      - normalize_powerstig_stig_version is match("^[0-9]+\\.[0-9]+$")
    fail_msg: >-
      normalize_powerstig_stig_version must be a version number (e.g., "2.5").
      Got: {{ normalize_powerstig_stig_version }}
  tags:
    - powerstig
    - validation

- name: Run PowerSTIG DSC compliance scan
  ansible.windows.win_powershell:
    script: |
      Import-Module PowerSTIG

      $osVersion = (Get-CimInstance Win32_OperatingSystem).Caption
      $stigVersion = "{{ normalize_powerstig_stig_version }}"

      # Determine OS version for STIG selection
      if ($osVersion -match "2022") {
          $osTag = "WindowsServer-2022-MS"
      } elseif ($osVersion -match "2019") {
          $osTag = "WindowsServer-2019-MS"
      } elseif ($osVersion -match "2025") {
          $osTag = "WindowsServer-2025-MS"
      } else {
          throw "Unsupported OS: $osVersion"
      }

      # Generate DSC configuration from PowerSTIG
      $null = & {
          WindowsServer -OsVersion $osTag -StigVersion $stigVersion -OutputPath "$env:TEMP\StigDsc"
      }

      # Apply the DSC configuration in test mode
      Start-DscConfiguration -Path "$env:TEMP\StigDsc" -Wait -Force

      # Get compliance results via DSC
      $testResult = Test-DscConfiguration -Detailed

      # Build structured results from DSC resource states
      $findings = @()
      foreach ($resource in $testResult.ResourcesInDesiredState) {
          $findings += @{
              RuleId = $resource.ResourceId -replace '.*\[(.+?)\].*', '$1'
              Status = "Compliant"
              ResourceName = $resource.ResourceId
              InDesiredState = $true
          }
      }
      foreach ($resource in $testResult.ResourcesNotInDesiredState) {
          $findings += @{
              RuleId = $resource.ResourceId -replace '.*\[(.+?)\].*', '$1'
              Status = "NonCompliant"
              ResourceName = $resource.ResourceId
              InDesiredState = $false
          }
      }

      @{
          InDesiredState = $testResult.InDesiredState
          TotalResources = $findings.Count
          CompliantCount = ($findings | Where-Object { $_.InDesiredState }).Count
          NonCompliantCount = ($findings | Where-Object { -not $_.InDesiredState }).Count
          Findings = $findings
      } | ConvertTo-Json -Depth 10
  register: normalize_powerstig_raw_results
  tags:
    - powerstig
    - scan

- name: Parse PowerSTIG results
  ansible.builtin.set_fact:
    normalize_powerstig_parsed: "{{ normalize_powerstig_raw_results.output | from_json }}"
  tags:
    - powerstig

- name: Transform PowerSTIG results to CFF
  ansible.builtin.set_fact:
    normalize_powerstig_cff_output:
      schema_version: "1.0.0"
      scan_id: "{{ normalize_powerstig_scan_id }}"
      scan_type: "{{ normalize_powerstig_scan_type }}"
      framework: "{{ normalize_powerstig_framework }}"
      benchmark: "PowerSTIG DISA STIG"
      benchmark_version: "{{ normalize_powerstig_version_check.output | trim }}"
      target_host: "{{ inventory_hostname }}"
      target_os: "Windows Server {{ ansible_distribution_version | default('unknown') }}"
      scan_timestamp: "{{ ansible_date_time.iso8601 }}"
      scanner: powerstig
      findings: >-
        {{
          normalize_powerstig_parsed | default([]) | map('security.compliance_windows.to_cff_powerstig') | list
        }}
  tags:
    - powerstig
    - normalize

- name: Compute CFF summary
  ansible.builtin.set_fact:
    normalize_powerstig_cff_summary:
      total: "{{ normalize_powerstig_cff_output.findings | length }}"
      passed: "{{ normalize_powerstig_cff_output.findings | selectattr('status', 'equalto', 'pass') | list | length }}"
      failed: "{{ normalize_powerstig_cff_output.findings | selectattr('status', 'equalto', 'fail') | list | length }}"
      pass_rate: >-
        {{
          ((normalize_powerstig_cff_output.findings | selectattr('status', 'equalto', 'pass') | list | length)
          / (normalize_powerstig_cff_output.findings | length | int)) * 100
          if (normalize_powerstig_cff_output.findings | length | int) > 0 else 0
        }}
  tags:
    - powerstig
    - normalize

- name: Write CFF JSON
  ansible.windows.win_copy:
    content: "{{ normalize_powerstig_cff_output | to_nice_json }}"
    dest: "{{ normalize_powerstig_output_path }}/cff-powerstig-{{ normalize_powerstig_scan_id }}.json"
  check_mode: false
  tags:
    - powerstig
    - reporting
