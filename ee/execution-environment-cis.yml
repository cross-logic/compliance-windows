---
# Execution Environment: Windows Server CIS Benchmarks
#
# Uses infra.windows_ops as the scanning and remediation engine.
# This EE includes the full infra.windows_ops collection (unlike the STIG EE
# which uses DISA SCC downloaded at runtime).
#
# Build:
#   ansible-builder build -f execution-environment-cis.yml -t compliance-windows-cis:latest -v3

version: 3

build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: '--pre'

options:
  package_manager_path: /usr/bin/microdnf

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  galaxy:
    collections:
      - name: ansible.windows
        version: ">=2.0.0"
      - name: community.windows
        version: ">=3.0.0"
      - name: infra.windows_ops
        version: ">=2.0.1"
  python:
    - pywinrm>=0.4.3
    - requests-credssp>=2.0.0
    - requests-ntlm>=1.2.0

additional_build_steps:
  prepend_galaxy:
    - COPY _build/collections/ /usr/share/ansible/collections/

  append_final:
    # Verify collections
    - RUN ansible-galaxy collection list security.compliance_windows
    - RUN ansible-galaxy collection list infra.windows_ops
    - RUN ansible-galaxy collection list ansible.windows

    # Verify WinRM connectivity deps
    - RUN python3 -c "import winrm; print('pywinrm', winrm.__version__)"
    - RUN python3 -c "import requests_credssp; print('credssp OK')"
    - RUN python3 -c "import requests_ntlm; print('ntlm OK')"
