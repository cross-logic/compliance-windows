name: Build Compliance EEs

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'roles/**'
      - 'playbooks/**'
      - 'rules/**'
      - 'ee/**'
      - 'meta/**'
      - 'galaxy.yml'
      - '.github/workflows/build-ee.yml'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'EE profiles to build (stig, cis, or all)'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: stig
            ee_file: ee/execution-environment.yml
            image_suffix: windows-stig
            scanner_type: scc

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/compliance-${{ matrix.image_suffix }}

    steps:
      - name: Check if profile should build
        id: check
        run: |
          INPUT="${{ github.event.inputs.profiles || 'all' }}"
          if [[ "$INPUT" == "all" ]] || echo "$INPUT" | grep -q "${{ matrix.profile }}"; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-builder
        if: steps.check.outputs.skip != 'true'
        run: pip install ansible-builder

      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to registry.redhat.io
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USER }}
          password: ${{ secrets.REDHAT_REGISTRY_TOKEN }}

      - name: Prepare build context
        if: steps.check.outputs.skip != 'true'
        run: |
          BUILD_DIR=$(mktemp -d)
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          # Copy EE definition
          cp ${{ matrix.ee_file }} $BUILD_DIR/execution-environment.yml

          # Create ansible-builder context
          cd $BUILD_DIR
          ansible-builder create -f execution-environment.yml -v 3

          # Copy this collection into the build context
          mkdir -p context/_build/collections/ansible_collections/security
          cp -r $GITHUB_WORKSPACE \
            context/_build/collections/ansible_collections/security/compliance_windows
          # Clean build artifacts
          rm -rf context/_build/collections/ansible_collections/security/compliance_windows/.git
          rm -rf context/_build/collections/ansible_collections/security/compliance_windows/build

          # For STIG EE: fetch SCAP benchmarks (public domain)
          if [ "${{ matrix.scanner_type }}" = "scc" ]; then
            echo "Fetching SCAP benchmarks from niwc-atlantic/scap-content-library..."
            mkdir -p context/_build/scap-content
            git clone --depth 1 https://github.com/niwc-atlantic/scap-content-library.git \
              /tmp/scap-content-library || true
            if [ -d /tmp/scap-content-library ]; then
              cp -r /tmp/scap-content-library/ context/_build/scap-content/
              rm -rf /tmp/scap-content-library
            else
              echo "WARNING: Could not fetch SCAP content"
              mkdir -p context/_build/scap-content
              touch context/_build/scap-content/.placeholder
            fi
          fi

      - name: Build EE image
        if: steps.check.outputs.skip != 'true'
        run: |
          cd $BUILD_DIR
          docker build -f context/Containerfile -t $IMAGE_NAME:latest context

      - name: Tag with SHA
        if: steps.check.outputs.skip != 'true'
        run: docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ github.sha }}

      - name: Push to GHCR
        if: steps.check.outputs.skip != 'true'
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: Verify EE contents
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "=== Verifying $IMAGE_NAME ==="
          docker run --rm $IMAGE_NAME:latest \
            ansible-galaxy collection list security.compliance_windows
          docker run --rm $IMAGE_NAME:latest \
            python3 -c "import winrm; print('pywinrm OK')"
          docker run --rm $IMAGE_NAME:latest \
            python3 -c "import requests_credssp; print('credssp OK')"

          if [ "${{ matrix.scanner_type }}" = "scc" ]; then
            docker run --rm $IMAGE_NAME:latest \
              test -d /usr/share/scap/windows/
            echo "SCAP content verified"
          fi

          if [ "${{ matrix.scanner_type }}" = "ansible" ]; then
            docker run --rm $IMAGE_NAME:latest \
              ansible-galaxy collection list infra.windows_ops
          fi

          echo "EE verified: $IMAGE_NAME"

      - name: Verify normalizer module integrity
        if: steps.check.outputs.skip != 'true' && matrix.scanner_type == 'scc'
        run: |
          docker run --rm $IMAGE_NAME:latest python3 -c "
            import importlib
            mod = importlib.import_module(
              'ansible_collections.security.compliance_windows.plugins.module_utils.normalize_common'
            )
            spec = mod.ARGUMENT_SPEC
            assert 'scanner_name' in spec, 'scanner_name missing from ARGUMENT_SPEC'
            print('Normalizer ARGUMENT_SPEC verified: ' + ', '.join(sorted(spec.keys())))
          "

      - name: Mirror to PAH
        if: steps.check.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.PAH_HOST }}" ]; then
            echo "PAH_HOST not configured — skipping PAH mirror"
            exit 0
          fi
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          VERSION="1.0.0"
          for TAG in "${VERSION}" "${SHORT_SHA}" "latest"; do
            skopeo copy \
              --src-creds ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} \
              --dest-creds ${{ secrets.PAH_SVC_USER }}:${{ secrets.PAH_SVC_PASSWORD }} \
              docker://${IMAGE_NAME}:latest \
              docker://${{ secrets.PAH_HOST }}/compliance-${{ matrix.image_suffix }}:${TAG}
          done
          echo "Mirrored to PAH with tags: ${VERSION}, ${SHORT_SHA}, latest"

      - name: Trigger dashboard EE rebuild
        if: steps.check.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          repository: cross-logic/aap-compliance-pipelines
          event-type: collection-updated
          client-payload: >-
            {"collection": "compliance_windows",
             "sha": "${{ github.sha }}",
             "version": "1.0.0",
             "repo": "${{ github.repository }}"}
