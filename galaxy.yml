---
namespace: security
name: compliance_windows
version: 0.1.0
readme: README.md
authors:
  - Steve Fulmer <sfulmer@redhat.com>
description: >-
  EXPERIMENTAL - proof of concept, not production ready.
  Compliance profile wrapper for Windows Server DISA STIG, CIS Benchmarks,
  HIPAA, and PCI-DSS v4.0. Provides pipeline-oriented playbooks,
  Common Findings Format (CFF) output normalization, and regulatory
  control crosswalk mapping. Uses infra.windows_ops as content engine.
license_file: LICENSE
tags:
  - windows
  - security
  - compliance
  - stig
  - cis
  - hipaa
  - pcidss
  - hardening
  - infrastructure
repository: https://github.com/stevefulme1/compliance-windows
documentation: https://github.com/stevefulme1/compliance-windows
issues: https://github.com/stevefulme1/compliance-windows/issues
dependencies:
  infra.windows_ops: ">=2.0.1"
  ansible.windows: ">=2.0.0"
  community.windows: ">=3.0.0"
build_ignore:
  - .git
  - .github
  - .gitignore
  - tests
  - ee
  - docs
  - scripts
  - tasks
  - install.yml
  - uninstall.yml
  - "*.tar.gz"
