---
# Register Windows Server DISA STIG compliance profile on AAP Controller
#
# Usage:
#   ansible-playbook install.yml -e aap_host=https://controller.example.com -e aap_token=<token>
#
# This playbook creates the necessary Controller resources:
#   - Assessment Job Template (scan with DISA SCC)
#   - Remediation Job Template (apply Windows STIG controls)
#
# If a profile with framework=DISA_STIG + platform=Windows already exists in the
# compliance backend, this playbook reconnects it (preserving all historical data).
#
# Prerequisites:
#   - Execution Environment with DISA SCC + pywinrm
#   - Target inventory with Windows Server 2019/2022/2025 hosts
#   - WinRM credential with administrator access to targets

- name: "Install: DISA STIG Windows Server Profile"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_host: "{{ lookup('env', 'AAP_HOST') }}"
    aap_token: "{{ lookup('env', 'AAP_API_TOKEN') }}"
    backstage_api_url: "{{ lookup('env', 'BACKSTAGE_API_URL') | default('', true) }}"
    backstage_token: "{{ lookup('env', 'BACKSTAGE_TOKEN') | default('', true) }}"
    org_name: "{{ organization | default('Default') }}"
    project_name: "{{ project | default('compliance-profile-windows') }}"
    ee_name: "{{ execution_environment | default('compliance-windows-stig') }}"
    inventory_name: "{{ inventory | default('compliance-windows-inventory') }}"

    profile:
      slug: "windows-server-stig"
      name: "DISA STIG Windows Server"
      framework: "DISA_STIG"
      version: "V2R7"
      description: "DISA STIG compliance scanning for Windows Server 2019/2022/2025 using SCAP Compliance Checker."
      certification_status: "certified"
      certification_authority: "SCAP 1.3"
      certification_disclaimer: "DISA SCC (SCAP Compliance Checker) is NIST SCAP 1.3 validated. Scan results are accepted for DISA STIG compliance assessments. SCC is downloaded ephemerally from dl.dod.cyber.mil at scan time due to NIWC trade secret licensing restrictions."
      platform: "Windows Server 2019/2022/2025"
      scanner: "scc"
      os_family: ["Windows"]
      scan_jt_name: "compliance-scan-stig-windows"
      scan_playbook: "collections/ansible_collections/security/compliance_windows/playbooks/scan.yml"
      remediate_jt_name: "compliance-remediate-stig-windows"
      remediate_playbook: "collections/ansible_collections/security/compliance_windows/playbooks/remediate-windows-stig.yml"
      display_config:
        gauge_label: "compliance rate"
        gauge_unit: "rules"
        remediation_verb: "Remediate"
        severity_map:
          CAT_I: "CAT I (High)"
          CAT_II: "CAT II (Medium)"
          CAT_III: "CAT III (Low)"
        columns:
          - { field: "stig_id", label: "STIG ID" }
          - { field: "title", label: "Title" }
          - { field: "severity", label: "Severity" }
          - { field: "status", label: "Status" }
          - { field: "fix_text", label: "Fix" }
        tabs:
          - label: "STIG Findings"
            icon: "security"
            layout:
              - { widget: "score_grid", title: "Compliance Overview" }
              - { widget: "findings_table", title: "STIG Controls" }
              - { widget: "host_breakdown", title: "Host Compliance Status" }
          - label: "HIPAA Crosswalk"
            icon: "health_and_safety"
            layout:
              - { widget: "crosswalk_summary", title: "HIPAA Control Coverage", crosswalk_profile: "hipaa" }
              - { widget: "crosswalk_controls_table", title: "HIPAA Control Mapping", crosswalk_profile: "hipaa" }
          - label: "PCI-DSS Crosswalk"
            icon: "payment"
            layout:
              - { widget: "crosswalk_summary", title: "PCI-DSS Control Coverage", crosswalk_profile: "pci_dss_v4" }
              - { widget: "crosswalk_controls_table", title: "PCI-DSS Control Mapping", crosswalk_profile: "pci_dss_v4" }

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - aap_host | length > 0
          - aap_token | length > 0
        fail_msg: "Set AAP_HOST and AAP_API_TOKEN environment variables or pass -e aap_host=... -e aap_token=..."

    - name: Create assessment job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.scan_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.scan_playbook }}"
          inventory: "{{ inventory_name }}"
          become_enabled: true
          ask_variables_on_launch: true
          ask_inventory_on_launch: true
          use_fact_cache: true
          extra_vars: "{{ {'profile_slug': profile.slug, 'profile_name': profile.name, 'framework': profile.framework, 'version': profile.version, 'description': profile.description, 'certification_status': profile.certification_status, 'certification_authority': profile.certification_authority, 'certification_disclaimer': profile.certification_disclaimer, 'remediate_jt_name': profile.remediate_jt_name, 'remediation_playbook': profile.remediate_playbook, 'platform': profile.platform, 'scanner': profile.scanner, 'os_family': profile.os_family, 'display_config': profile.display_config} | to_json }}"
        validate_certs: false
        status_code: [200, 201]
      register: _scan_jt
      failed_when: false

    - name: Create remediation job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.remediate_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.remediate_playbook }}"
          inventory: "{{ inventory_name }}"
          ask_variables_on_launch: true
          ask_inventory_on_launch: true
          ask_tags_on_launch: true
          ask_limit_on_launch: true
        validate_certs: false
        status_code: [200, 201]
      register: _remediate_jt
      failed_when: false

    # NOTE: The /profiles/connect endpoint is forward-looking — the backend
    # does not implement it yet. This task will silently skip (failed_when: false)
    # until the lifecycle management endpoints are built (L6 build plan phase).
    - name: Reconnect profile in compliance backend (if available)
      when: backstage_api_url | length > 0
      ansible.builtin.uri:
        url: "{{ backstage_api_url }}/api/compliance/profiles/connect"
        method: POST
        headers:
          Authorization: "Bearer {{ backstage_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          framework: "{{ profile.framework }}"
          version: "{{ profile.version }}"
          displayName: "{{ profile.name }}"
        validate_certs: false
        status_code: [200, 201]
      register: _backend_connect
      failed_when: false

    - name: Report installation result
      ansible.builtin.debug:
        msg: |
          === {{ profile.name }} Profile Installed ===
          Assessment JT: {{ profile.scan_jt_name }} (id={{ _scan_jt.json.id | default('exists') }})
          Remediation JT: {{ profile.remediate_jt_name }} (id={{ _remediate_jt.json.id | default('exists') }})
          Framework: {{ profile.framework }}
          Version: {{ profile.version }}
          Backend: {{ 'reconnected' if (_backend_connect.status | default(0)) in [200, 201] else 'skipped (no BACKSTAGE_API_URL)' }}
