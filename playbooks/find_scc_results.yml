---
- name: Find ALL SCC artifacts on target
  hosts: "{{ compliance_target_hosts | default('nm-prod-win202501') }}"
  gather_facts: false
  tasks:
    - name: Search user profile for SCC data
      ansible.windows.win_powershell:
        script: |
          $searchPaths = @(
              "$env:USERPROFILE\SCC",
              "$env:LOCALAPPDATA\SCC",
              "$env:APPDATA\SCC",
              "C:\Temp\compliance-scan",
              "C:\Temp\compliance-scc"
          )
          $results = @{}
          foreach ($p in $searchPaths) {
              if (Test-Path $p) {
                  $files = Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue |
                      Select Name, Length, FullName, LastWriteTime |
                      Select -First 30
                  $results[$p] = @{ Exists = $true; FileCount = (Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue).Count; Sample = @($files) }
              } else {
                  $results[$p] = @{ Exists = $false }
              }
          }
          $results | ConvertTo-Json -Depth 5
      register: _search

    - name: Show SCC locations
      ansible.builtin.debug:
        msg: "{{ (_search.output | join('')) }}"
