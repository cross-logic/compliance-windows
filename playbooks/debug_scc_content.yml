---
# Debug: Inspect SCC content structure and options.xml on a Windows target
# Run via: JT with playbook debug_scc_content.yml, one host, credential 9
#
# This deploys SCC 5.14, inspects its content directory and options.xml,
# then lists what content is available. Used to understand the content
# installation requirements before automating.

- name: "Debug: Deploy SCC and inspect content"
  hosts: "{{ compliance_target_hosts | default('all') }}"
  gather_facts: false

  vars:
    scc_version: "5.14"
    scc_cache_dir: /tmp/compliance-scc
    target_scc_dir: 'C:\Temp\compliance-scc-debug'
    scap_content_ee_dir: /usr/share/scap/windows

  tasks:
    - name: Download and extract SCC on EE (reuse cache)
      delegate_to: localhost
      run_once: true
      block:
        - name: Create cache dir
          ansible.builtin.file:
            path: "{{ scc_cache_dir }}"
            state: directory
            mode: '0755'

        - name: Download SCC bundle
          ansible.builtin.get_url:
            url: "https://dl.dod.cyber.mil/wp-content/uploads/stigs/zip/scc-{{ scc_version }}_Windows_bundle.zip"
            dest: "{{ scc_cache_dir }}/scc-{{ scc_version }}_Windows_bundle.zip"
            mode: '0644'
            timeout: 300

        - name: Extract outer bundle
          ansible.builtin.unarchive:
            src: "{{ scc_cache_dir }}/scc-{{ scc_version }}_Windows_bundle.zip"
            dest: "{{ scc_cache_dir }}"
            remote_src: true
            creates: "{{ scc_cache_dir }}/scc-{{ scc_version }}_Windows"

        - name: Extract inner portable ZIP
          ansible.builtin.unarchive:
            src: "{{ scc_cache_dir }}/scc-{{ scc_version }}_Windows/scc-{{ scc_version }}_Windows.zip"
            dest: "{{ scc_cache_dir }}"
            remote_src: true
            creates: "{{ scc_cache_dir }}/scc_{{ scc_version }}"

        - name: Locate cscc.exe
          ansible.builtin.find:
            paths: "{{ scc_cache_dir }}"
            patterns: "cscc.exe"
            recurse: true
          register: _cscc
          failed_when: _cscc.files | length == 0

        - name: Set cscc dir
          ansible.builtin.set_fact:
            cscc_exe_dir: "{{ (_cscc.files | first).path | dirname }}"

    - name: Deploy SCC to target
      block:
        - name: Create SCC dir on target
          ansible.windows.win_file:
            path: "{{ target_scc_dir }}"
            state: directory

        - name: Copy SCC to target
          ansible.windows.win_copy:
            src: "{{ cscc_exe_dir }}/"
            dest: "{{ target_scc_dir }}"

        - name: "Diag 1: List SCC top-level structure"
          ansible.windows.win_powershell:
            script: |
              Get-ChildItem 'C:\Temp\compliance-scc-debug' -Depth 1 |
                Select-Object Mode, Length, Name, FullName |
                ConvertTo-Json -Depth 3
          register: _diag1

        - name: Show SCC structure
          ansible.builtin.debug:
            msg: "{{ _diag1.output | join('') }}"

        - name: "Diag 2: List Resources/Content/ structure"
          ansible.windows.win_powershell:
            script: |
              $contentPath = 'C:\Temp\compliance-scc-debug\Resources\Content'
              if (Test-Path $contentPath) {
                  Get-ChildItem $contentPath -Recurse -Depth 2 |
                    Select-Object Mode, Length, Name, FullName |
                    ConvertTo-Json -Depth 3
              } else {
                  @{ Error = "Content directory not found at $contentPath" } | ConvertTo-Json
              }
          register: _diag2

        - name: Show content structure
          ansible.builtin.debug:
            msg: "{{ _diag2.output | join('') }}"

        - name: "Diag 3: Read options.xml"
          ansible.windows.win_powershell:
            script: |
              $optPath = 'C:\Temp\compliance-scc-debug\options.xml'
              if (Test-Path $optPath) {
                  $content = Get-Content $optPath -Raw
                  @{
                      Exists = $true
                      Length = $content.Length
                      Preview = $content.Substring(0, [Math]::Min(5000, $content.Length))
                  } | ConvertTo-Json -Depth 3
              } else {
                  @{ Exists = $false; SearchResults = (Get-ChildItem 'C:\Temp\compliance-scc-debug' -Filter 'options*' -Recurse | Select Name, FullName) } | ConvertTo-Json -Depth 3
              }
          register: _diag3

        - name: Show options.xml
          ansible.builtin.debug:
            msg: "{{ _diag3.output | join('') }}"

        - name: "Diag 4: Try cscc -? for help output"
          ansible.windows.win_command:
            cmd: "{{ target_scc_dir }}\\cscc.exe -?"
            chdir: "{{ target_scc_dir }}"
          register: _diag4
          failed_when: false
          changed_when: false

        - name: Show SCC help
          ansible.builtin.debug:
            msg: "{{ _diag4.stdout | default(_diag4.stderr | default('no output')) }}"

        - name: "Diag 5: Check SCAP content in EE"
          delegate_to: localhost
          ansible.builtin.find:
            paths: "{{ scap_content_ee_dir }}"
            patterns: "*"
            recurse: true
          register: _diag5

        - name: Show EE SCAP content
          ansible.builtin.debug:
            msg: "{{ _diag5.files | map(attribute='path') | list }}"

        - name: "Diag 6: Try running SCC with debug to see what content it finds"
          ansible.windows.win_command:
            cmd: "{{ target_scc_dir }}\\cscc.exe -d -u C:\\Temp\\scc-debug-results"
            chdir: "{{ target_scc_dir }}"
          register: _diag6
          failed_when: false
          changed_when: false
          timeout: 300

        - name: Show SCC debug output
          ansible.builtin.debug:
            msg: "{{ _diag6.stdout | default('') }}"

        - name: "Diag 7: Check results directory after debug scan"
          ansible.windows.win_powershell:
            script: |
              $paths = @('C:\Temp\scc-debug-results', 'C:\Temp\compliance-scc-debug\Sessions')
              $results = @{}
              foreach ($p in $paths) {
                  if (Test-Path $p) {
                      $files = Get-ChildItem $p -Recurse -File | Select Name, Length, FullName
                      $results[$p] = @{ Exists = $true; FileCount = $files.Count; Files = @($files | Select -First 20) }
                  } else {
                      $results[$p] = @{ Exists = $false }
                  }
              }
              $results | ConvertTo-Json -Depth 5
          register: _diag7

        - name: Show result locations
          ansible.builtin.debug:
            msg: "{{ _diag7.output | join('') }}"

      always:
        - name: Cleanup
          ansible.windows.win_file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ target_scc_dir }}"
            - 'C:\Temp\scc-debug-results'
          failed_when: false
