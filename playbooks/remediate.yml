---
# Remediate Windows compliance findings.
#
# Supports two remediation engines:
#   - windows_ops (default): uses infra.windows_ops roles
#   - powerstig: uses PowerSTIG DSC configurations
#
# Variables:
#   target_hosts: Host pattern (default: 'windows')
#   compliance_remediation_engine: 'windows_ops' or 'powerstig'
#   compliance_skip_rules: V-IDs to skip (default: [])
#   compliance_only_rules: V-IDs to apply exclusively (default: [])
#   compliance_stig_version: PowerSTIG STIG version (default: '2.1')

- name: Remediate Windows compliance findings
  hosts: "{{ target_hosts | default('windows') }}"
  gather_facts: true

  tasks:
    - name: Run STIG remediation via infra.windows_ops
      ansible.builtin.include_role:
        name: infra.windows_ops.windows_manage_stig
      vars:
        windows_manage_stig_skip_rules: "{{ compliance_skip_rules | default([]) }}"
        windows_manage_stig_only_rules: "{{ compliance_only_rules | default([]) }}"
        windows_manage_stig_generate_report: true
        windows_manage_stig_fail_on_non_compliance: "{{ compliance_fail_on_non_compliance | default(false) }}"
      when: compliance_remediation_engine | default('windows_ops') == 'windows_ops'

    - name: Run PowerSTIG DSC remediation
      when: compliance_remediation_engine | default('windows_ops') == 'powerstig'
      block:
        - name: Apply PowerSTIG DSC configuration
          ansible.windows.win_powershell:
            parameters:
              StigVersion: "{{ compliance_stig_version | default('2.1') }}"
            script: |
              param([string]$StigVersion)
              Import-Module PowerSTIG
              $osVersion = (Get-CimInstance Win32_OperatingSystem).Caption
              if ($osVersion -match "2022") { $osTag = "WindowsServer-2022-MS" }
              elseif ($osVersion -match "2019") { $osTag = "WindowsServer-2019-MS" }
              elseif ($osVersion -match "2025") { $osTag = "WindowsServer-2025-MS" }
              else { throw "Unsupported OS: $osVersion" }

              $null = & {
                WindowsServer -OsVersion $osTag -StigVersion $StigVersion -OutputPath "$env:TEMP\StigDsc"
              }
              Start-DscConfiguration -Path "$env:TEMP\StigDsc" -Wait -Force
          register: _powerstig_result

      rescue:
        - name: Report PowerSTIG remediation failure
          ansible.builtin.debug:
            msg: >-
              PowerSTIG remediation failed on {{ inventory_hostname }}.
              Error: {{ _powerstig_result.error | default(ansible_failed_result.msg | default('unknown')) }}.
              The host may be in a partially remediated state. Review DSC logs on the target.
