---
# Standard entry point for ControllerClient: normalize results to CFF.
# Converts raw compliance scan results to Common Findings Format.
- name: Normalize compliance results to CFF
  hosts: "{{ compliance_target_hosts | default('windows') }}"
  gather_facts: true

  tasks:
    - name: Normalize STIG findings
      ansible.builtin.include_role:
        name: security.compliance_windows.normalize_stig_findings
      vars:
        normalize_stig_findings_source_results: "{{ compliance_raw_results | default([]) }}"
        normalize_stig_findings_scan_id: "{{ compliance_scan_id | default(ansible_date_time.iso8601_basic_short) }}"
        normalize_stig_findings_scan_type: "{{ compliance_scan_type | default('scan') }}"
        normalize_stig_findings_framework: "{{ compliance_framework | default('DISA_STIG') }}"
        normalize_stig_findings_output_path: "{{ compliance_output_path | default('C:\\\\compliance_reports') }}"
      when: compliance_source_format | default('stig') == 'stig'

    - name: Normalize CIS findings
      ansible.builtin.include_role:
        name: security.compliance_windows.normalize_cis_findings
      when: compliance_source_format | default('stig') == 'cis'

    - name: Normalize PowerSTIG findings
      ansible.builtin.include_role:
        name: security.compliance_windows.normalize_powerstig
      vars:
        normalize_powerstig_stig_version: "{{ compliance_stig_version | default('2.1') }}"
        normalize_powerstig_scan_id: "{{ compliance_scan_id | default(ansible_date_time.iso8601_basic_short) }}"
        normalize_powerstig_scan_type: normalize
        normalize_powerstig_framework: "{{ compliance_framework | default('DISA_STIG') }}"
        normalize_powerstig_output_path: "{{ compliance_output_path | default('C:\\\\compliance_reports') }}"
      when: compliance_source_format | default('stig') == 'powerstig'
