---
# Stream NDJSON findings to the AAP Compliance Dashboard API (ADR-033/034).
#
# The normalizer composes .ndjson files on disk (preamble + one finding per line).
# This task streams each file via uri+src — zero findings in Jinja2 variable space.
#
# Required vars (caller must provide):
#   backstage_api_url: Dashboard backend URL (play var or inventory var)
#   push_results_ndjson_dir: Directory containing .ndjson files from normalizer
#     (defaults to /tmp/compliance-results)
#
# Optional vars:
#   scan_id: Scan identifier (required for API push)
#   ingest_token: Per-scan security token (ADR-010)
#   aap_validate_certs: TLS verification (default: false)
#
# Legacy vars (accepted but unused by NDJSON path):
#   push_results_cff_output: CFF JSON output (for role-based normalizers)
#   push_results_cff_summary: CFF summary stats (for role-based normalizers)

- name: Find per-host NDJSON files
  ansible.builtin.find:
    paths: "{{ push_results_ndjson_dir | default('/tmp/compliance-results') }}"
    patterns: "*.ndjson"
  register: _push_ndjson_files
  delegate_to: localhost

- name: Stream NDJSON findings to compliance API
  ansible.builtin.uri:
    url: "{{ backstage_api_url }}/api/compliance/findings/ingest"
    method: POST
    src: "{{ item.path }}"
    headers:
      Content-Type: application/x-ndjson
      Authorization: "Bearer {{ ingest_token | default('') }}"
    status_code: [201]
    validate_certs: "{{ aap_validate_certs | default(false) }}"
    timeout: 120
  no_log: true
  loop: "{{ _push_ndjson_files.files | default([]) | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  delegate_to: localhost
  register: _push_results
  failed_when: false

- name: Fail if no findings were ingested
  ansible.builtin.fail:
    msg: >-
      All {{ _push_ndjson_files.files | length }} POST requests failed.
      Check the POST task output above for HTTP status codes and errors.
  when:
    - _push_ndjson_files.files | default([]) | length > 0
    - _push_results.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'equalto', 201) | list | length == 0

- name: Report push results
  ansible.builtin.debug:
    msg: >-
      POSTed findings for
      {{ _push_results.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'equalto', 201) | list | length }}/{{ _push_ndjson_files.files | default([]) | length }}
      hosts to {{ backstage_api_url }}.
  when: _push_ndjson_files.files | default([]) | length > 0
