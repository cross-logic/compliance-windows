---
- name: "Compliance: Gather and evaluate Windows hosts"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  tasks:
    - name: Gather compliance facts
      ansible.builtin.include_role:
        name: compliance_gather
      tags:
        - gather

- name: "Compliance: Evaluate gathered facts against rules"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    compliance_rules_file: "{{ rules_file | default('rules/stig_windows_server_2022.yml') }}"
  tasks:
    - name: Load compliance rules
      ansible.builtin.include_vars:
        file: "{{ compliance_rules_file }}"
        name: compliance_content
      tags:
        - evaluate

    - name: Evaluate each host's facts against rules
      security.compliance_windows.compliance_evaluate:
        facts: "{{ hostvars[item]['compliance_gather_facts'] }}"
        rules: "{{ compliance_content.rules }}"
        host: "{{ item }}"
        profile: "{{ compliance_content.profile.id | default('stig') }}"
      register: evaluation_results
      loop: "{{ groups[target_hosts | default('all')] }}"
      tags:
        - evaluate

    - name: Display evaluation summary
      ansible.builtin.debug:
        msg: >-
          Host {{ item.host }}:
          {{ item.summary.pass }} passed,
          {{ item.summary.fail }} failed,
          {{ item.summary.notchecked }} not checked
      loop: "{{ evaluation_results.results | map(attribute='item') | list }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - evaluate
