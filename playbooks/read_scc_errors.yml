---
- name: Read SCC error log from target
  hosts: "{{ compliance_target_hosts | default('nm-prod-win202501') }}"
  gather_facts: false
  tasks:
    - name: Find error logs
      ansible.windows.win_find:
        paths: 'C:\Temp\compliance-scan\Logs'
        patterns: "*Error_Log*"
        recurse: true
      register: _error_logs

    - name: Read first error log
      ansible.windows.win_powershell:
        script: |
          $logPath = '{{ (_error_logs.files | default([]) | first | default({})).path | default("") }}'
          if ($logPath -and (Test-Path $logPath)) {
              Get-Content $logPath -Raw
          } else {
              "No error log found. Searching..."
              Get-ChildItem 'C:\Temp\compliance-scan' -Recurse -File | Select Name, Length, FullName | ConvertTo-Json
          }
      register: _error_content
      when: _error_logs.files | default([]) | length > 0

    - name: Show error log
      ansible.builtin.debug:
        msg: "{{ _error_content.output | default(['No error log']) | join('') }}"

    - name: Also check Sessions directory for any results
      ansible.windows.win_powershell:
        script: |
          $sessionsPath = 'C:\Temp\compliance-scan\Sessions'
          if (Test-Path $sessionsPath) {
              Get-ChildItem $sessionsPath -Recurse -File | Select Name, Length, FullName | ConvertTo-Json -Depth 3
          } else {
              "No Sessions directory"
          }
      register: _sessions

    - name: Show sessions content
      ansible.builtin.debug:
        msg: "{{ _sessions.output | default(['empty']) | join('') }}"
